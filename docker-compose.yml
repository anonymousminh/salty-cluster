# Local Elasticsearch + OpenTelemetry Collector for development.
#   docker compose up -d
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/conf/config.yaml"]
    volumes: ["./otel/collector-local.yaml:/conf/config.yaml:ro"]
    environment:
      DASH0_OTLP_ENDPOINT: ${DASH0_OTLP_ENDPOINT:-}
      DASH0_AUTH_TOKEN: ${DASH0_AUTH_TOKEN:-}
    ports: ["4317:4317", "4318:4318"]
