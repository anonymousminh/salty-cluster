# Argo CD Application: syncs deploy/k8s from main into the team namespace.
#   kubectl apply -n argocd -f deploy/argocd/application.yaml
# Every merge to main (after Gitar review + green CI) is deployed automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: salty-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anonymousminh/salty-cluster.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: salty-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
