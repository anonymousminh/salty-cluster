server {
  listen 8080;
  root /usr/share/nginx/html;

  # Presence + chat (WebSocket). The hub keeps players in memory, so this goes to the single-replica
  # `realtime` Service, not the scaled-out `api` one. Long timeouts: the socket is idle between messages
  # (the server pings every 25 s, which also keeps any proxy in front of this one from timing it out).
  location = /api/realtime {
    proxy_pass http://realtime:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /console/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /console/ {
    try_files $uri /console/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
