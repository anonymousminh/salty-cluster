# OpenTelemetry Collector: everything from the namespace -> Dash0.
# Namespace-scoped on purpose (works inside a team namespace without cluster-wide RBAC).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  k8s_events:
    namespaces: ["${env:K8S_NAMESPACE}"]

processors:
  memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
  k8sattributes:
    filter:
      namespace: ${env:K8S_NAMESPACE}
    extract:
      metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name, container.image.tag]
  resource:
    attributes:
      - { key: deployment.environment.name, value: hackathon, action: upsert }
  batch: {}

exporters:
  otlp/dash0:
    endpoint: ${env:DASH0_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
      Dash0-Dataset: salty-cluster

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }

service:
  extensions: [health_check]
  pipelines:
    traces:  { receivers: [otlp],             processors: [memory_limiter, k8sattributes, resource, batch], exporters: [otlp/dash0] }
    metrics: { receivers: [otlp],             processors: [memory_limiter, k8sattributes, resource, batch], exporters: [otlp/dash0] }
    logs:    { receivers: [otlp, k8s_events], processors: [memory_limiter, k8sattributes, resource, batch], exporters: [otlp/dash0] }
