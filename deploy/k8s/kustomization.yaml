apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: salty-cluster # change to the namespace the organizers gave your team
labels:
  - pairs: { app.kubernetes.io/part-of: salty-cluster }
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - otel-collector.yaml
  - es-setup-job.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=collector-config.yaml
# CI pushes :main and :sha-<commit> on every merge to main. For a reproducible deploy, open a PR
# that sets newTag to that commit's sha tag (docs/deployment-guide.md, "Deploy a new version").
images:
  - name: ghcr.io/anonymousminh/salty-cluster-api
    newTag: main
  - name: ghcr.io/anonymousminh/salty-cluster-web
    newTag: main
