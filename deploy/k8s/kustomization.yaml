apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: salty-cluster # change to the namespace the organizers gave your team
labels:
  - pairs: { app.kubernetes.io/part-of: salty-cluster }
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - otel-collector.yaml
  - es-setup-job.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=collector-config.yaml
images:
  - name: ghcr.io/anonymousminh/salty-cluster-api
    newTag: "0.1.0"
  - name: ghcr.io/anonymousminh/salty-cluster-web
    newTag: "0.1.0"
