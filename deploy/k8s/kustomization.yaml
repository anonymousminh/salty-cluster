apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: salty-cluster # your own cluster; the hackathon cluster uses deploy/cnh (team-<team>)
labels:
  - pairs: {app.kubernetes.io/part-of: salty-cluster}
resources:
  - api.yaml
  - realtime.yaml
  - web.yaml
  - otel-collector.yaml
  - es-setup-job.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=collector-config.yaml
# Set by CI: after every merge to main the deploy-commit job pins newTag to that commit's image
# ("deploy: <sha> [skip ci]"), and Argo CD rolls it out. Don't edit by hand.
images:
  - name: ghcr.io/anonymousminh/salty-cluster-api
    newTag: sha-5d9affe2d7f0577ac16bef482101b013edd56fc7
  - name: ghcr.io/anonymousminh/salty-cluster-web
    newTag: sha-5d9affe2d7f0577ac16bef482101b013edd56fc7
