apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: otel-collector }
rules:
  - apiGroups: [""]
    resources: [pods, events, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: otel-collector }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: otel-collector }
subjects:
  - { kind: ServiceAccount, name: otel-collector }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: salty-cluster }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: salty-cluster }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 13133, name: health }
          env:
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DASH0_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: salty-secrets, key: DASH0_AUTH_TOKEN } }
            - name: DASH0_OTLP_ENDPOINT
              valueFrom: { secretKeyRef: { name: salty-secrets, key: DASH0_OTLP_ENDPOINT } }
          readinessProbe: { httpGet: { path: /, port: health } }
          livenessProbe: { httpGet: { path: /, port: health } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: config, mountPath: /conf }]
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { port: 4317, targetPort: otlp-grpc, name: otlp-grpc }
    - { port: 4318, targetPort: otlp-http, name: otlp-http }
