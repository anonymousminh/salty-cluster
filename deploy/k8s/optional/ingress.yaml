# Optional: public URL through an ingress controller (e.g. ingress-nginx). Not in the default
# kustomization because every cluster names its ingress class and hosts differently.
#   1. Set host (and ingressClassName) below.
#   2. kubectl -n salty-cluster apply -f deploy/k8s/optional/ingress.yaml
# Only the web Service is exposed; it proxies /api to the api Service inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: salty-cluster }
spec:
  ingressClassName: nginx
  rules:
    - host: meetspace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
